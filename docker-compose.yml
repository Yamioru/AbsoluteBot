services:
  absolutebot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: absolutebot
    restart: always
    working_dir: /app
    ports:
    - "5000:5000"
    volumes:
      - ${ABS_DATA_DIR:-./data}:/app
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
